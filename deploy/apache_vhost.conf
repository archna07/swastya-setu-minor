# Swastya Setu – Apache Production Virtual Host Configuration
<VirtualHost *:80>
    ServerName swastyasetu.example.com
    ServerAdmin webmaster@swastyasetu.example.com
    DocumentRoot /var/www/Swastya-setu-app

    <Directory /var/www/Swastya-setu-app>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Protect internal configuration, models, and metadata from public HTTP requests
    <Directory /var/www/Swastya-setu-app/config>
        Require all denied
    </Directory>
    <Directory /var/www/Swastya-setu-app/ai_service>
        Require all denied
    </Directory>
    <Directory /var/www/Swastya-setu-app/backups>
        Require all denied
    </Directory>
    <Directory /var/www/Swastya-setu-app/tests>
        Require all denied
    </Directory>

    # Security Headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/swastya_error.log
    CustomLog ${APACHE_LOG_DIR}/swastya_access.log combined
</VirtualHost>

